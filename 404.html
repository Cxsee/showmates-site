<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showmates</title>
<link rel="stylesheet" href="/style.css">
<script>
// Link condivisi dall'app (showmates.app/u/<nome>, /l/<lista>, /daily, /t/<tv|movie>/<id>): con l'app installata li apre Android,
// qui arriva solo chi non ce l'ha. Un profilo diventa un invito alla lista d'attesa; il resto va alla home.
(function () {
  var p = location.pathname.split('/').filter(Boolean);
  if (p[0] === 'u' && p[1]) { location.replace('/?u=' + encodeURIComponent(decodeURIComponent(p[1])) + '&src=invite'); return; }
  if (p[0] === 'l' || p[0] === 'daily' || p[0] === 't') { location.replace('/?src=' + ({l: 'list', daily: 'daily', t: 'title'})[p[0]]); }
})();
</script>
</head>
<body>
<header class="top"><div class="bar"><a class="brand" href="/"><span class="logo"></span>Showmates</a></div></header>
<main>
<h1>Page not found · Pagina non trovata</h1>
<p><a href="/">showmates.app</a></p>
</main>
</body>
</html>
