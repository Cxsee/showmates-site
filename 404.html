<link rel="stylesheet" href="/style.css">
<script>
// Link condivisi dall'app (showmates.app/u/<nome>, /l/<lista>, /daily, /t/<tv|movie>/<id>, /try, /c/<sfida>, /tr/<torneo>): con l'app installata li apre Android,
// qui arriva solo chi non ce l'ha. Un profilo diventa un invito alla lista d'attesa; il resto va alla home.
(function () {
  var p = location.pathname.split('/').filter(Boolean);
  if (p[0] === 'u' && p[1]) { location.replace('/?u=' + encodeURIComponent(decodeURIComponent(p[1])) + '&src=invite'); return; }
  var src = {l: 'list', daily: 'daily', t: 'title', 'try': 'try', c: 'challenge', tr: 'tournament'}[p[0]];
  if (src) { location.replace('/?src=' + src); }
})();
</script>
